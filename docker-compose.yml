services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    build: .
    command: uvicorn sentinel.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  ingest:
    build: .
    command: python -m sentinel.ingest.runner
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  nlp:
    build: .
    command: python -m sentinel.nlp.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      
volumes:
  pgdata:
